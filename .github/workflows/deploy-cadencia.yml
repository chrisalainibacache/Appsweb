# Publica Cadencia (carpeta baile/) en Cloudflare Workers.
# Se ejecuta al subir cambios de baile/ a la rama de Cadencia, o a mano desde Actions.
# Requiere dos secretos del repositorio: CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
# Si faltan, el trabajo solo avisa y termina sin error.
name: Publicar Cadencia

on:
  push:
    branches: [claude/nueva-aplicacion-kkkctc]
    paths: ['baile/**', '.github/workflows/deploy-cadencia.yml']
  workflow_dispatch:

concurrency:
  group: deploy-cadencia
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: baile
    steps:
      - name: Avisar si faltan los secretos de Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "::warning::Faltan los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID. No se publicó. Agrégalos y usa Re-run all jobs."
        working-directory: .
      - uses: actions/checkout@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
      - uses: actions/setup-node@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        with:
          node-version: 22
      - name: Instalar y probar
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npm install && npm test
      - name: Crear el bucket de videos si no existe
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler r2 bucket create cadencia-videos || echo "El bucket ya existe"
      - name: Publicar
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler deploy
